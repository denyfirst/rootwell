<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Choose your password · Rootwell</title>
  <link rel="preload" href="/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/auth.css">
  <script src="/auth.js" defer></script>
</head>
<body data-mode="setup">
  <main class="shell">
    <p class="wordmark">rootwell<span class="wordmark-stop">.</span></p>
    <section class="card" aria-labelledby="title">
      <h1 id="title">Choose your password</h1>
      <p class="hint">Replace the first password before you start. Use at least 15 characters, and keep it in your password manager.</p>
      <form id="auth-form" method="post" action="/api/password">
        <label for="password">First password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <label for="next">New password</label>
        <input id="next" name="next" type="password" autocomplete="new-password" minlength="15" required>
        <label for="confirm">New password again</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="15" required>
        <button type="submit">Save password</button>
        <p id="status" role="alert" aria-live="polite"></p>
      </form>
    </section>
    <button class="secondary" type="button" id="sign-out">Sign out</button>
  </main>
  <footer class="colophon"><strong>rootwell</strong>, by <strong>denyfirst<span class="credit-stop">.</span></strong></footer>
</body>
</html>
