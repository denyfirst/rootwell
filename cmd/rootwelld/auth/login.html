<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Sign in · Rootwell</title>
  <link rel="preload" href="/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/auth.css">
  <script src="/auth.js" defer></script>
</head>
<body data-mode="login">
  <main class="shell">
    <p class="wordmark">rootwell<span class="wordmark-stop">.</span></p>
    <section class="card" aria-labelledby="title">
      <h1 id="title">Sign in</h1>
      <p class="hint">Use the password for this Rootwell.</p>
      <form id="auth-form" method="post" action="/api/session">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
        <p id="status" role="alert" aria-live="polite"></p>
      </form>
    </section>
    <p class="foot">The first password is shown once by <code>rootwelld init</code> on the server.</p>
  </main>
  <footer class="colophon"><strong>rootwell</strong>, by <strong>denyfirst<span class="credit-stop">.</span></strong></footer>
</body>
</html>
