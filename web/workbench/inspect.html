  <meta charset="utf-8">

</head>
<body>
<div class="shell">
<aside class="rail" aria-label="Menu">
  <a class="wordmark" href="/certificates" aria-label="Rootwell, certificates">rootwell<span class="wordmark-stop">.</span></a>
  <div class="rail-pages">
    <nav class="nav" aria-label="Pages"><a class="nav-item" href="/certificates"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="soft-fill" d="M5 3.5h10l4 4v13H5z"/><path d="M15 3.5v4h4M8.5 11h7M8.5 14.5h4.5"/></svg>Certificates</a><a class="nav-item" href="/website-check"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="soft-fill" cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.3 3.5 5.1 3.5 8.5s-1.2 6.2-3.5 8.5c-2.3-2.3-3.5-5.1-3.5-8.5s1.2-6.2 3.5-8.5z"/></svg>Website check</a><a class="nav-item" href="/inspect" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="soft-fill" cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>Inspect</a><a class="nav-item" href="/convert"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8h15l-3.5-3.5M20 16H5l3.5 3.5"/></svg>Convert</a><a class="nav-item" href="/request"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="soft-fill" d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M12 11v6M9 14h6"/></svg>Request</a></nav>
    <nav class="nav" aria-label="You"><a class="nav-item" href="/account"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="soft-fill" cx="12" cy="12" r="8.5"/><circle cx="12" cy="10" r="3"/><path d="M6.7 18.2c1.3-1.9 3.1-2.9 5.3-2.9s4 1 5.3 2.9"/></svg>Account</a><a class="nav-item" href="/installation"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="soft-fill" d="M5 4.5h14a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z"/><path d="M5 13.5h14a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zM7.5 7.5h1M7.5 16.5h1"/></svg>Installation</a></nav>
  </div>
  <div class="rail-foot">
    <button class="nav-item" id="theme-toggle" type="button" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="soft-fill" d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg><span class="label-text">Theme</span></button>
    <button class="nav-item" id="rail-sign-out" type="button" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 4.5h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-3"/><path d="M10 8l-4 4 4 4M6 12h9"/></svg><span class="label-text">Sign out</span></button>
    <p class="credit">rootwell, by denyfirst<span class="credit-stop">.</span></p>
  </div>
</aside>
<main class="page"><div class="page-inner">
<div class="page-head"><div><h1>Inspect</h1><p>See what is inside a certificate file. It never leaves this browser.</p></div></div>
<div class="stack">
  <label class="drop" id="inspect-drop" for="inspect-file">
    <svg class="icon icon-xl" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path class="soft-fill" d="M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
    <strong>Drop a certificate file</strong>
    <span>or click to choose · PEM, CRT, CER, DER or P7B, up to 8 files</span>
    <input class="file-input" id="inspect-file" type="file" multiple accept=".pem,.crt,.cer,.der,.p7b,.p7c,.txt,.ca-bundle">
  </label>
  <div class="file-chip" id="inspect-chip" hidden>
    <span class="cert-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="soft-fill" d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/></svg></span>
    <div><strong id="inspect-chip-name"></strong><small id="inspect-chip-info"></small></div>
    <button class="btn btn-secondary btn-sm" id="inspect-again" type="button">Choose another file</button>
  </div>
  <p class="notice bad" id="inspect-error" role="alert" hidden></p>
  <div class="stack" id="inspect-result" hidden></div>
  <section class="card" id="key-card" hidden>
    <div class="card-head"><h3>Check a private key</h3></div>
    <div class="card-body stack">
      <div class="inline">
        <input class="input grow" id="key-file" type="file" accept=".key,.pem,.der,.txt" aria-label="Private key file">
        <input class="input narrow" id="key-password" type="password" autocomplete="off" placeholder="Key password, if it has one" aria-label="Key password">
        <button class="btn btn-secondary" id="key-check" type="button">Check key</button>
      </div>
      <div id="key-status" role="status" aria-live="polite"></div>
    </div>
  </section>
</div>
</div></main>
</div>
</body>
</html>
