<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Convert · Rootwell</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/rootwell.css">
  <script src="/theme.js"></script>
  <script src="/session.js" defer></script>
  <script src="/wasm_exec.js" defer></script>
  <script src="/wasm-loader.js" defer></script>
  <script src="/ui.js" defer></script>
  <script src="/private-worker-client.js" defer></script>
  <script src="/pfx-worker-client.js" defer></script>
  <script src="/csr-worker-client.js" defer></script>
  <script src="/convert.js" defer></script>
</head>
<body>
<div class="shell">
<aside class="rail" aria-label="Menu">
  <a class="wordmark" href="/certificates" aria-label="Rootwell, certificates">rootwell<span class="wordmark-stop">.</span></a>
  <div class="rail-pages">
    <nav class="nav" aria-label="Pages"><a class="nav-item" href="/certificates"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="soft-fill" d="M5 3.5h10l4 4v13H5z"/><path d="M15 3.5v4h4M8.5 11h7M8.5 14.5h4.5"/></svg>Certificates</a><a class="nav-item" href="/website-check"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="soft-fill" cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.3 3.5 5.1 3.5 8.5s-1.2 6.2-3.5 8.5c-2.3-2.3-3.5-5.1-3.5-8.5s1.2-6.2 3.5-8.5z"/></svg>Website check</a><a class="nav-item" href="/inspect"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="soft-fill" cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>Inspect</a><a class="nav-item" href="/convert" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8h15l-3.5-3.5M20 16H5l3.5 3.5"/></svg>Convert</a><a class="nav-item" href="/request"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="soft-fill" d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M12 11v6M9 14h6"/></svg>Request</a></nav>
    <nav class="nav" aria-label="You"><a class="nav-item" href="/account"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="soft-fill" cx="12" cy="12" r="8.5"/><circle cx="12" cy="10" r="3"/><path d="M6.7 18.2c1.3-1.9 3.1-2.9 5.3-2.9s4 1 5.3 2.9"/></svg>Account</a></nav>
  </div>
  <div class="rail-foot">
    <button class="nav-item" id="theme-toggle" type="button" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="soft-fill" d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg><span class="label-text">Theme</span></button>
    <button class="nav-item" id="rail-sign-out" type="button" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 4.5h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-3"/><path d="M10 8l-4 4 4 4M6 12h9"/></svg><span class="label-text">Sign out</span></button>
    <p class="credit">rootwell, by denyfirst<span class="credit-stop">.</span></p>
  </div>
</aside>
<main class="page"><div class="page-inner">
<div class="page-head"><div><h1>Convert</h1><p>Turn a certificate, key or PFX into the format your server needs.</p></div></div>
<div class="stack">
  <label class="drop" id="convert-drop" for="convert-file">
    <svg class="icon icon-xl" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path class="soft-fill" d="M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
    <strong>Drop a certificate, key or PFX</strong>
    <span>or click to choose · drop a certificate and its key together to make a PFX</span>
    <input class="file-input" id="convert-file" type="file" multiple accept=".pem,.crt,.cer,.der,.key,.pfx,.p12,.txt,.ca-bundle">
  </label>
  <p class="notice bad" id="convert-error" role="alert" hidden></p>
  <section class="card" id="convert-card" hidden>
    <div class="card-body stack">
      <div class="file-chip" id="convert-chip" hidden>
    <span class="cert-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="soft-fill" d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/></svg></span>
    <div><strong id="convert-chip-name"></strong><small id="convert-chip-info"></small></div>
    <button class="btn btn-secondary btn-sm" id="convert-again" type="button">Choose other files</button>
  </div>
      <form class="field narrow" id="convert-unlock" hidden>
        <label for="convert-password" id="convert-password-label">Password</label>
        <div class="input-row"><input class="input" id="convert-password" type="password" autocomplete="off"><button class="btn" id="convert-open" type="submit">Open</button></div>
        <span class="error-text" id="convert-unlock-error" role="alert"></span>
      </form>
      <div class="field" id="convert-formats" hidden><span class="label">Save as</span><div class="choices" id="convert-choices"></div></div>
      <div class="field narrow" id="convert-key-row" hidden>
        <label for="convert-key-file">Private key</label>
        <input class="input" id="convert-key-file" type="file" accept=".key,.pem,.der,.txt">
      </div>
      <div class="field narrow" id="convert-secret-row" hidden>
        <label for="convert-secret"><span id="convert-secret-label">Password</span><span class="muted" id="convert-secret-optional">Optional</span></label>
        <div class="input-row"><input class="input mono" id="convert-secret" type="password" autocomplete="new-password" spellcheck="false"><button class="btn btn-secondary" id="convert-generate" type="button">Generate</button><button class="btn btn-secondary" id="convert-copy" type="button" hidden>Copy</button></div>
        <span class="meta" id="convert-secret-note" hidden>Save this password now. Rootwell does not keep it.</span>
      </div>
      <div class="inline" id="convert-go" hidden><button class="btn" id="convert-download" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 20h14"/></svg><span id="convert-download-name">Download</span></button><span class="meta" id="convert-contents"></span></div>
      <div id="convert-status" role="status" aria-live="polite"></div>
    </div>
  </section>
</div>
</div></main>
</div>
</body>
</html>
