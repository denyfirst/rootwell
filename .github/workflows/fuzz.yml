name: Scheduled fuzzing

on:
  schedule:
    - cron: "31 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    concurrency:
      group: scheduled-fuzz-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzRun
            package: ./internal/cli
          - target: FuzzACMEPlanRequestJSON
            package: ./cmd/rootwelld
          - target: FuzzHumanCertificateOutput
            package: ./internal/cli
          - target: FuzzJSONCertificateOutput
            package: ./internal/cli
          - target: FuzzHumanVerificationOutput
            package: ./internal/cli
          - target: FuzzExploreOutputIsTerminalSafe
            package: ./internal/cli
          - target: FuzzInspectCertificate
            package: ./internal/certinspect
          - target: FuzzEvaluateTimeWindow
            package: ./internal/certinspect
          - target: FuzzProcessReturnsJSON
            package: ./internal/browserinspect
          - target: FuzzProcessPublicBundleReturnsJSON
            package: ./internal/browserexplore
          - target: FuzzProcessNeverReturnsTrust
            package: ./internal/browserchain
          - target: FuzzPrepareNeverReturnsUnselectedCertificate
            package: ./internal/browserexport
          - target: FuzzPrepareBundleNeverExportsUnselectedCertificate
            package: ./internal/browserbundleexport
          - target: FuzzSimpleNeverUsesSourceAsTrust
            package: ./internal/browserverify
          - target: FuzzPrepareNeverExportsUnverifiedSource
            package: ./internal/browserverifiedexport
          - target: FuzzParseCertificateBundle
            package: ./internal/certverify
          - target: FuzzParsePublicBundle
            package: ./internal/publicbundle
          - target: FuzzOpenSealedRecord
            package: ./internal/inventoryseal
          - target: FuzzOpenImage
            package: ./internal/inventorystore
          - target: FuzzAutomationStatusWholeImage
            package: ./internal/inventorystore
          - target: FuzzOpenRecoveryWrap
            package: ./internal/instanceaccess
          - target: FuzzRecoveryEnvelopeParsing
            package: ./internal/instanceaccess
          - target: FuzzOpenAccessSnapshot
            package: ./internal/instanceaccess
          - target: FuzzOpenFullSnapshot
            package: ./internal/instanceaccess
          - target: FuzzReadLimited
            package: ./internal/fileinput
          - target: FuzzMatch
            package: ./internal/keymatch
          - target: FuzzPrepareRefusesSecretInCertificate
            package: ./internal/certificatepair
          - target: FuzzBundleMatchRefusesMalformedKey
            package: ./internal/certificatepair
          - target: FuzzInspectPrivateKeyNoSecretEcho
            package: ./internal/browserprivateconvert
          - target: FuzzEncryptedProfileNoPanic
            package: ./internal/browserprivateconvert
          - target: FuzzPFXPreflight
            package: ./internal/pfxinspect
          - target: FuzzInspectCSR
            package: ./internal/csrworkbench
          - target: FuzzPublicComparison
            package: ./internal/publicinventory
          - target: FuzzProviderRetryAfter
            package: ./internal/providerretry
          - target: FuzzARIInformation
            package: ./internal/renewalpolicy
          - target: FuzzARICertificateID
            package: ./internal/renewalpolicy
          - target: FuzzRenewalSelection
            package: ./internal/renewalpolicy
          - target: FuzzStagingARIURI
            package: ./internal/acmestaging
          - target: FuzzRenewalTimingPayload
            package: ./internal/inventorystore
          - target: FuzzTimingWatchInput
            package: ./cmd/rootwelld
          - target: FuzzRenewalTimingRequest
            package: ./cmd/rootwelld
          - target: FuzzCloudflareRecordResponse
            package: ./internal/acmestaging
          - target: FuzzVersionValue
            package: ./internal/version
          - target: FuzzStagingDirectory
            package: ./internal/acmestaging
          - target: FuzzDirectoryConsent
            package: ./cmd/rootwelld
          - target: FuzzStagingAccountRequest
            package: ./cmd/rootwelld
          - target: FuzzStagingAccountPayload
            package: ./internal/inventorystore
          - target: FuzzCloudflareConfigurationPayload
            package: ./internal/inventorystore
          - target: FuzzDNSPlanPayload
            package: ./internal/inventorystore
          - target: FuzzDNSOperationRequest
            package: ./cmd/rootwelld
          - target: FuzzCloudflareConfigurationRequest
            package: ./cmd/rootwelld
          - target: FuzzStagingRegistrationResponse
            package: ./internal/acmestaging
          - target: FuzzStagingRegistrationRequest
            package: ./cmd/rootwelld
          - target: FuzzManualDNSCAResponse
            package: ./internal/acmestaging
          - target: FuzzManualDNSOrderPayload
            package: ./internal/inventorystore
          - target: FuzzManualDNSRequest
            package: ./cmd/rootwelld
          - target: FuzzCertificateRequestBinding
            package: ./internal/acmecertrequest
          - target: FuzzStagingCertificateReceipt
            package: ./internal/acmecertificate
          - target: FuzzCertificateCAResponse
            package: ./internal/acmestaging
          - target: FuzzStagingCertificateRequestPayload
            package: ./internal/inventorystore
          - target: FuzzStagingIssuancePayload
            package: ./internal/inventorystore
          - target: FuzzClosedStagingRequest
            package: ./internal/inventorystore
          - target: FuzzRenewalOrderBinding
            package: ./internal/inventorystore
          - target: FuzzStagingCompletionPayload
            package: ./internal/inventorystore
    steps:
      - name: Check out the default branch
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Fuzz for five minutes
        run: go test "${{ matrix.package }}" -run=^$ -fuzz="^${{ matrix.target }}$" -fuzztime=5m
