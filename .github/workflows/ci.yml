name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny by default. Each job receives only read access to repository contents.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs, never a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow uses no third-party GitHub actions. The runner's git client
# checks out the exact event SHA, and pinned Go tools are verified through the
# module checksum database without entering Rootwell's runtime module.

jobs:
  windows-pfx:
    name: Windows ephemeral PFX interoperability
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git init -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout -q FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Every Go step uses exactly the toolchain go.mod names, never the runner's.
          $goVersion = (Select-String -Path go.mod -Pattern '^go ').Line.Substring(3)
          "GOTOOLCHAIN=go$goVersion" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Import a synthetic PFX without persisting its key
        shell: pwsh
        run: ./scripts/test-windows-pfx-interop.ps1
      - name: Verify browser CSR/key output with Windows Node and OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csrWasm = Join-Path $env:RUNNER_TEMP 'rootwell-csr.wasm'
          $env:GOOS = 'js'
          $env:GOARCH = 'wasm'
          go build -trimpath -o $csrWasm ./cmd/rootwell-browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:GOOS
          Remove-Item Env:GOARCH
          $csrRuntime = Join-Path (go env GOROOT) 'lib/wasm/wasm_exec.js'
          node scripts/test-browser-csr.mjs $csrWasm $csrRuntime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  container-volume:
    name: Linux container volume recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          # Every Go step uses exactly the toolchain go.mod names, never the runner's.
          echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"

      - name: Exercise isolated persistent volumes and fresh restore
        env:
          ROOTWELL_UPGRADE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/test-container-config.mjs
          bash scripts/test-build-context.sh
          node scripts/test-release-guards.mjs
          bash scripts/test-container-volume.sh

  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          # Every Go step uses exactly the toolchain go.mod names, never the runner's.
          echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"

      - name: Report toolchain
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN

      - name: Verify module files are tidy
        run: |
          set -eu
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "go mod tidy modified the repository:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Verify module checksums
        run: go mod verify

      - name: Check formatting
        run: |
          set -eu
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-clean:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet every initially supported platform
        run: |
          set -eu
          for os in linux darwin windows; do
            echo "vet GOOS=${os}"
            CGO_ENABLED=0 GOOS="${os}" go vet ./...
          done

      - name: Build the browser inspection engine
        run: |
          set -eu
          GOOS=js GOARCH=wasm go build -trimpath \
            -o "${RUNNER_TEMP}/rootwell.wasm" ./cmd/rootwell-browser
          test -s "${RUNNER_TEMP}/rootwell.wasm"
          test "$(stat -c %s "${RUNNER_TEMP}/rootwell.wasm")" -le 16777216
          test -s "$(go env GOROOT)/lib/wasm/wasm_exec.js"

      - name: Check browser script syntax
        run: |
          set -eu
          node --check web/workbench/theme.js
          node --check web/workbench/session.js
          node --check web/workbench/ui.js
          node --check web/workbench/wasm-loader.js
          node --check web/workbench/certificates.js
          node --check web/workbench/inspect.js
          node --check web/workbench/convert.js
          node --check web/workbench/request.js
          node --check web/workbench/request-keep.js
          node --check web/workbench/private-worker-client.js
          node --check web/workbench/private-key-worker.js
          node --check web/workbench/pfx-worker-client.js
          node --check web/workbench/pfx-worker.js
          node --check web/workbench/csr-worker-client.js
          node --check web/workbench/csr-worker.js
          node --check cmd/rootwelld/auth/auth.js
          node --check cmd/rootwelld/auth/website-check.js
          node --check cmd/rootwelld/auth/certificate-pfx.js
          node --check cmd/rootwelld/auth/certificate-pfx-worker.js
          node --check scripts/check-container-config.mjs
          node --check scripts/test-container-config.mjs
          node --check scripts/test-release-guards.mjs
          node --check scripts/test-session.mjs
          node --check scripts/test-rootwelld-auth.mjs
          node --check scripts/test-browser-wasm.mjs
          node --check scripts/test-browser-pfx.mjs
          node --check scripts/test-browser-csr.mjs
          node --check scripts/test-workbench-private-worker.mjs
          node --check scripts/test-workbench-pfx-worker.mjs
          node --check scripts/test-workbench-csr-worker.mjs
          node --check scripts/test-certificate-pfx-worker.mjs
          node --check scripts/test-certificates.mjs
          node --check scripts/test-website-check.mjs
          node --check scripts/test-inspect.mjs
          node --check scripts/test-convert.mjs
          node --check scripts/test-request.mjs

      - name: Test the browser engine and the pages
        run: |
          set -eu
          wasm="${RUNNER_TEMP}/rootwell.wasm"
          runtime="$(go env GOROOT)/lib/wasm/wasm_exec.js"
          node scripts/test-browser-wasm.mjs "${wasm}" "${runtime}"
          node scripts/test-browser-pfx.mjs "${wasm}" "${runtime}"
          node scripts/test-browser-csr.mjs "${wasm}" "${runtime}"
          node scripts/test-workbench-private-worker.mjs
          node scripts/test-workbench-pfx-worker.mjs
          node scripts/test-workbench-csr-worker.mjs
          node scripts/test-certificate-pfx-worker.mjs
          node scripts/test-rootwelld-auth.mjs
          node scripts/test-session.mjs
          node scripts/test-certificates.mjs "${wasm}" "${runtime}"
          node scripts/test-website-check.mjs
          node scripts/test-inspect.mjs "${wasm}" "${runtime}"
          node scripts/test-convert.mjs "${wasm}" "${runtime}"
          node scripts/test-request.mjs "${wasm}" "${runtime}"

      - name: Smoke test PFX preparation and certificate custody in the vault
        run: go test -race -run '^TestPreparePreservesPublicCollectionAndOnlyEncryptsMatchingKey$|^TestPrepareRefusesWrongPasswordTamperAndUnrelatedWithoutPartialMaterial$|^TestPrepareOpensLegacyWindowsAndPasswordlessPFX$|^TestLinuxCertificatesLiveInTheVaultAndSurviveARestart$|^TestPFXImportPreparationHasNoNetworkOrCustodyAuthority$' -count=1 -timeout=8m ./internal/browserpfximport ./cmd/rootwelld ./internal/architecture

      - name: Smoke test the ACME protocol pieces kept for renewal
        # The session-bound automation is gone; Phase 3c rebuilds renewal on
        # these pieces. Fail a broken ARI reading early.
        run: go test -race -run '^TestARI' -count=1 -timeout=2m ./internal/acmestaging ./internal/renewalpolicy

      - name: Test with race detector
        # Real password/KDF and recovery tests retain production iterations.
        # The expanded Linux custody package exceeded 20m under instrumentation
        # while executing PBKDF2, not waiting on a lock. Keep the entire suite
        # and its KDF parameters; this bound is per package, not runtime policy.
        run: go test -race -shuffle=on -timeout=40m -coverprofile=coverage.out ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Reproduce committed CLI, daemon and browser artifacts independently
        run: bash scripts/test-reproducible-build.sh

  invariants:
    name: Security invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          # Every Go step uses exactly the toolchain go.mod names, never the runner's.
          echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"

      - name: Verify every cited test exists
        run: |
          set -eu
          grep -ohE '`(Test|Fuzz)[A-Za-z0-9_]+' docs/SECURITY-INVARIANTS.md \
            | tr -d '`' | sort -u > /tmp/cited
          grep -rhoE '^func (Test|Fuzz)[A-Za-z0-9_]+' --include='*_test.go' . \
            | sed -E 's/^func //' | sort -u > /tmp/defined

          missing="$(comm -23 /tmp/cited /tmp/defined)"
          if [ -n "${missing}" ]; then
            echo "Security invariants cite tests that do not exist:"
            echo "${missing}"
            exit 1
          fi

          echo "Every security invariant citation resolves to a test."

  fuzz-targets:
    name: Fuzz target inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          # Every Go step uses exactly the toolchain go.mod names, never the runner's.
          echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"

      - name: Verify every fuzz target is scheduled
        run: |
          set -eu
          grep -rhoE '^func (Fuzz[A-Za-z0-9_]+)\(' --include='*_test.go' . \
            | sed -E 's/^func //; s/\($//' | sort -u > /tmp/in-tree
          grep -oE 'target: (Fuzz[A-Za-z0-9_]+)' .github/workflows/fuzz.yml \
            | sed -E 's/^target: //' | sort -u > /tmp/in-matrix

          missing="$(comm -23 /tmp/in-tree /tmp/in-matrix)"
          stale="$(comm -13 /tmp/in-tree /tmp/in-matrix)"
          if [ -n "${missing}" ]; then
            echo "Fuzz targets missing from the scheduled matrix:"
            echo "${missing}"
          fi
          if [ -n "${stale}" ]; then
            echo "Scheduled fuzz targets that no longer exist:"
            echo "${stale}"
          fi
          if [ -n "${missing}" ] || [ -n "${stale}" ]; then
            exit 1
          fi

          echo "Every fuzz target is scheduled."

  commit-signatures:
    name: Commit signatures
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch the pull request history without checking it out
        run: |
          set -eu

          # GITHUB_SHA is GitHub's synthetic two-parent merge commit for this
          # pull request. Deriving both sides from that commit avoids trusting
          # event-provided branch names or commit identifiers.
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --filter=blob:none origin "${GITHUB_SHA}"
          git update-ref refs/merge FETCH_HEAD

          read -r -a parents <<< "$(git rev-list --parents -n 1 refs/merge)"
          if [ "${#parents[@]}" -ne 3 ]; then
            echo "pull request merge commit does not have exactly two parents"
            exit 1
          fi
          git update-ref refs/base "${parents[1]}"
          git update-ref refs/head "${parents[2]}"

      - name: Verify every pull request commit against the protected base
        run: |
          set -eu

          # A pull request cannot authorize its own signing key. The trusted
          # list comes from the protected base commit, and no untrusted working
          # tree is created for this job.
          signers="${RUNNER_TEMP}/rootwell-commit-signers"
          git show refs/base:.github/commit-signers > "${signers}"
          test -s "${signers}"

          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${signers}"

          bad=0
          checked=0
          for commit in $(git rev-list refs/base..refs/head); do
            checked=$((checked + 1))
            if ! git verify-commit "${commit}" >/dev/null 2>&1; then
              printf 'unsigned or unknown signer: %s\n' \
                "$(git log -1 --format=%h "${commit}")"
              bad=$((bad + 1))
            fi
          done

          if [ "${checked}" -eq 0 ] || [ "${bad}" -ne 0 ]; then
            echo "${bad} of ${checked} commits failed signature verification."
            exit 1
          fi
          echo "${checked} commits verified."

  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          # Every Go step uses exactly the toolchain go.mod names, never the runner's.
          echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"

      - name: Run govulncheck
        run: |
          set -eu
          # An analyser must be built by at least the Go version it reads.
          GOTOOLCHAIN="$(awk '$1 == "go" {print "go" $2}' go.mod)"
          export GOTOOLCHAIN
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          GOOS=js GOARCH=wasm "$(go env GOPATH)/bin/govulncheck" ./cmd/rootwell-browser

  staticcheck:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          # Every Go step uses exactly the toolchain go.mod names, never the runner's.
          echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"

      - name: Run staticcheck
        run: |
          set -eu
          # An analyser must be built by at least the Go version it reads.
          GOTOOLCHAIN="$(awk '$1 == "go" {print "go" $2}' go.mod)"
          export GOTOOLCHAIN
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Validate GitHub workflows
        run: |
          set -eu
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  gosec:
    name: Security linter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          # Every Go step uses exactly the toolchain go.mod names, never the runner's.
          echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"

      - name: Run gosec
        run: |
          set -eu
          # An analyser must be built by at least the Go version it reads.
          GOTOOLCHAIN="$(awk '$1 == "go" {print "go" $2}' go.mod)"
          export GOTOOLCHAIN
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -severity medium -confidence medium ./...
